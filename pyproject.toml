[project]
name = "hexai"
version = "0.1.0"
description = "Perception and learning for the Freenove Big Hexapod"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "mjlab>=1.5",
    "opencv-python>=4.10,<5",
    "scipy>=1.14",
    "wandb>=0.18",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["plotly>=6", "pytest>=8", "ruff>=0.6", "ty>=0.0.1a1"]

[tool.ruff]
src = ["src"]
indent-width = 2
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B011", "E701"]

[tool.hatch.build.targets.wheel]
packages = ["src/hexai"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
